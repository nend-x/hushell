<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hushell-lockscreen</title>
  <link rel="stylesheet" href="lockscreen.css" />
  <script>
    /* load/error diagnostics: page load and script errors reach the
       backend log. */
    window.onerror = function (m, s, l, c) {
      try {
        var t = window.__TAURI__;
        if (t && t.core && t.core.invoke) {
          t.core.invoke("startmenu_ui_error", { msg: "lockscreen: " + String(m) + " @" + (l || 0) + ":" + (c || 0) });
        }
      } catch (e) { /* bridge missing — nothing to report to */ }
      return false;
    };
    window.addEventListener("load", function () {
      try {
        var t = window.__TAURI__;
        if (t && t.core && t.core.invoke) t.core.invoke("startmenu_ui_loaded");
      } catch (e) { /* nothing */ }
    });
  </script>
</head>
<body>
  <!-- The window is TRANSPARENT: the desktop behind it plays the lock
       choreography (icons fade out, the sweep line erases the ruled lines,
       the dark veil calms the sheet). This page is the lock screen's OWN
       effect canvas (the engine the desktop runs — the kind is the options
       choice, started only once the lock animation is done) plus the lock
       UI itself (clock, padlock, password line) — and the OLED burn shield,
       a black frame that fades in after a minute of silence. -->
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="burn" aria-hidden="true"></div>
  <div id="lock">
    <div id="clock" aria-live="off">--:--</div>

    <div id="lock-glyph" aria-hidden="true"><i class="shackle"></i><i class="body"></i><i class="keyhole"></i></div>

    <form id="unlock-form" autocomplete="off">
      <input id="password" type="password" placeholder="password" spellcheck="false" autocomplete="off" />
    </form>

    <!-- the no-password warning: lives HERE, under the field it describes —
         the user is looking at the lock when it matters (options already
         carries the plain "not set" state note) -->
    <div id="pw-warn" hidden>no password is set, please set it in settings</div>

    <footer id="lock-brand">hushell</footer>
  </div>
  <script src="theme.js"></script>
  <script src="fx.js"></script>
  <script src="lockscreen.js"></script>
</body>
</html>
